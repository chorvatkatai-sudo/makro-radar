name: Daten-Refresh (Feeds + FRED + Markt-Kompass + Telegram)

# Holt die Live-Daten auf einem GitHub-Runner (OFFENES Netz) und committet sie nach
# main, und schickt Telegram-Benachrichtigungen, sobald ein Event ein Ergebnis hat.
# Hintergrund: Die Claude-Cloud-Routinen laufen in einer Sandbox, die Outbound-Feeds
# (ForexFactory/TradingView/Yahoo/CFTC/FRED) zuverlaessig mit HTTP 403 blockt. Hier
# laeuft fetch-kalender.mjs ONLINE; die Routinen ziehen das Ergebnis per git pull.

on:
  schedule:
    - cron: '0 4,12 * * *'      # taeglicher Voll-Refresh VOR den Routinen (05:00 / 13:00 UTC)
    - cron: '0 6-21 * * 1-5'    # stuendlich werktags 06-21 UTC: zeitnahe Event-Erkennung
  # Sofort feuern, sobald die Morgen-/Freitags-Routine das Briefing pusht: macht den
  # Telegram-Tagesueberblick verlaesslich (~07:05 Wien), statt auf den GitHub-Cron zu
  # warten (der einzelne Slots oft 50+ min verspaetet oder ganz verwirft -> 30.6. kam
  # der Ueberblick erst 09:50 Wien). fetch-kalender.mjs schreibt briefing-aktuell.json
  # NICHT (nur Lesen), und GITHUB_TOKEN-Commits triggern keine Workflows -> kein Loop.
  push:
    branches: [main]
    paths:
      - 'daten/briefing-aktuell.json'
  workflow_dispatch:
    inputs:
      force_ueberblick:
        description: 'Tagesueberblick erneut senden (Test), auch wenn heute schon gesendet'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daten-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node 24 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Daten online holen (Feeds + FRED + Markt-Kompass)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: node scripts/fetch-kalender.mjs

      - name: Telegram-Benachrichtigung bei neuen Event-Ergebnissen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: node scripts/benachrichtige.mjs

      - name: Taeglicher Telegram-Tagesueberblick (einmal pro neuem Stand)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: node scripts/tagesbriefing.mjs ${{ inputs.force_ueberblick == true && '--force' || '' }}

      - name: Aenderungen committen und pushen (kein Marktdaten-Jitter-Spam)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          HOUR=$(date -u +%H)
          FORCE=false
          case "$HOUR" in 04|12) FORCE=true;; esac
          # Substanzieller Change = neue Ist-Werte / verschickte Benachrichtigung / neue Woche.
          if $FORCE || ! git diff --quiet -- daten/historie.json daten/benachrichtigt.json daten/naechste-woche.json daten/tagesbriefing-gesendet.json; then
            git add daten dashboard/data.js
            if git diff --cached --quiet; then
              echo "Nichts zu committen."
            else
              git commit -m "Daten-Refresh (GitHub Action): Feeds + FRED + Markt-Kompass"
              git pull --rebase --autostash origin ${GITHUB_REF_NAME}
              git push origin HEAD:${GITHUB_REF_NAME}
            fi
          else
            echo "Nur Marktdaten-Jitter (kein neues Ergebnis) — kein Commit."
          fi

      - name: Bei Fehlschlag per Telegram warnen (Daten-Watchdog)
        if: ${{ failure() }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e "const T=process.env.TELEGRAM_TOKEN,C=process.env.TELEGRAM_CHAT;if(!T||!C)process.exit(0);fetch('https://api.telegram.org/bot'+T+'/sendMessage',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({chat_id:C,text:'⚠️ Makro-Radar: Der Daten-Refresh ist fehlgeschlagen.\nDaten könnten veralten.\n'+process.env.RUN_URL,disable_web_page_preview:true})}).catch(()=>{})"
